name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The default suite: pure Python, offline, no external search tool. The R
  # tests in it skip cleanly here, because this image has no R.
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor metaannot is written to; 3.13 is the ceiling it is
        # expected to keep working on.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml numpy pytest
      - name: metaannot imports and answers --help
        run: |
          python metaannot.py --version
          python metaannot.py --help
      - name: default suite
        run: pytest -q

  # Everything marked slow: the full resume sweep and parallel-equals-serial
  # across every quant_format x peptide_assignment. Kept off the default run
  # because it is minutes rather than seconds.
  slow:
    name: slow suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyyaml numpy pytest
      - run: pytest -q -m slow

  # The R half: the report, the R object, and a real knit.
  #
  # Not the Ubuntu archive: it has no r-bioc-qfeatures, so the assay-link
  # tests — the headline deliverable of the R object, and the branch that had
  # never been exercised before the suite existed — skipped in silence and the
  # job still went green. P3M serves Bioconductor binaries for Ubuntu, so the
  # whole stack installs in minutes without compiling.
  r:
    name: R report and object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Exactly what RMD_TEMPLATE's setup chunk and build_object.R load.
          # Keep in step with doctor's RNEED/ROPT.
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::tibble
            any::stringr
            any::ggplot2
            any::purrr
            any::knitr
            any::rmarkdown
            any::patchwork
            bioc::limma
            bioc::SummarizedExperiment
            bioc::S4Vectors
            bioc::QFeatures
      # A package that failed to install used to mean "those tests skip", which
      # is precisely how the QFeatures gap stayed invisible: 19 passed, 2
      # skipped, job green. Fail here instead, so the next gap is loud.
      - name: every package the R tests need must be installed
        run: |
          # set -e explicitly, not relying on the runner's default shell: the
          # pandoc line below runs after this check and would otherwise decide
          # the step's exit status.
          set -euo pipefail
          Rscript -e '
            need <- c("readr", "dplyr", "tidyr", "tibble", "stringr",
                      "ggplot2", "purrr", "limma", "knitr", "rmarkdown",
                      "SummarizedExperiment", "S4Vectors", "QFeatures")
            cat(R.version.string, "\n")
            have <- vapply(need, requireNamespace, logical(1), quietly = TRUE)
            for (i in seq_along(need))
              cat(sprintf("%-22s %s\n", need[i], have[i]))
            if (any(!have))
              stop("the R tests would SKIP for want of: ",
                   paste(need[!have], collapse = ", "), call. = FALSE)'
          pandoc --version | head -1
      - run: pip install pandas pyyaml numpy pytest
      - name: R-marked tests, including a real knit
        # -ra, so the log says what skipped and why. Without it the only
        # evidence was a bare "ss" in the progress line.
        run: pytest -q -m "R" -o addopts="-ra"
      - name: doctor sees the R stack
        run: python metaannot.py doctor || true
