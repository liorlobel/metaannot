[pytest]
testpaths = tests
# The default run excludes `slow`. Everything else — including the R report
# and the R object — runs by default and skips cleanly where R is absent.
addopts = -ra --strict-markers -m "not slow"
markers =
    slow: excluded from the default run (`-m slow` or `-m ""` to include)
    R: needs Rscript and its packages; skipped, never failed, without them
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
